name: 1 - Unity lisans istegi
on:
  workflow_dispatch: {}
jobs:
  istek:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 2022.3.45f1
      - uses: actions/upload-artifact@v4
        with:
          name: Unity_lic.alf
          path: ${{ steps.alf.outputs.filePath }}
